[workspace]
resolver = "3"
members = [
    "crates/sp-core",
    "crates/sp-ui",
    "crates/sp-config",
    "crates/sp-api",
    "crates/sp-engine",
    "crates/sp-server",
    "crates/sp-tui-host",
    "crates/sp-web-host",
    "crates/sp-cli",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/voznik/start-page"

[workspace.dependencies]
sp-core = { path = "crates/sp-core" }
sp-ui = { path = "crates/sp-ui" }
sp-config = { path = "crates/sp-config" }
sp-api = { path = "crates/sp-api" }
sp-engine = { path = "crates/sp-engine" }
sp-server = { path = "crates/sp-server" }
sp-tui-host = { path = "crates/sp-tui-host" }
sp-web-host = { path = "crates/sp-web-host" }
# Pinned to match ratzilla 0.3.1's hard pin on ratatui 0.30.1. sp-ui must not
# depend on ratzilla (invariant 2), so both reach the same ratatui via unification.
ratatui = { version = "=0.30.1", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
crossterm = "0.29"
ratzilla = "=0.3.1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "1.1.5"
thiserror = "2.0.20"
directories = "6.0.0"
# Fuzzy filtering (T1.4). Only the synchronous `Matcher`/`Pattern` API (re-exported
# from nucleo-matcher) is used — the crate's `Nucleo` worker spawns a rayon
# threadpool, which never runs on wasm32-unknown-unknown; reduce() must stay
# synchronous anyway, so that worker is never constructed.
nucleo = "0.5.0"
# Ellipsizing long link names in sp-ui (T1.3). Already an internal dependency of ratatui-core
# (used there for the same string-truncation problem), so this just makes it explicit for sp-ui.
unicode-truncate = "2"
unicode-width = "0.2"
# Opens URLs via the OS-configured handler (Effect::OpenUrl in sp-tui-host).
open = "5.4.3"
# Catches a real SIGINT (e.g. `kill -INT`) that bypasses the Ctrl+C-as-keypress path:
# raw mode disables ISIG, so terminal-generated Ctrl+C never reaches the OS as a signal,
# but an external `kill -INT` still does and needs the terminal restored before exit.
ctrlc = "3.5.2"
# T1.5 query-string encoding. `percent-encoding` (not `form_urlencoded`) because it produces
# standard %-escapes (space -> %20) that every search backend and URL parser resolves
# identically; `form_urlencoded` targets application/x-www-form-urlencoded (space -> `+`),
# which is a narrower HTML-forms convention we don't need here. no_std-friendly, wasm32-clean.
percent-encoding = "2.3.2"
# T2.4: sp-server's static-asset router. Tokio is allowed here (sp-server is
# native-only, invariant 3 only forbids it in sp-core/sp-ui/sp-api).
axum = "0.8.9"
# `fs` feature pulls in ServeDir/ServeFile (+ mime_guess) for serving the
# extracted asset tree with `.precompressed_br()` content negotiation.
tower-http = { version = "0.7.1", features = ["fs"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
# Embeds crates/sp-web-host/dist/ into the sp-server binary at compile time
# (T2.4). Requires dist/ to exist before sp-server builds — xtask dist's job.
rust-embed = "8.12.0"
# sp-server extracts embedded assets to a tempdir at startup so tower-http's
# ServeDir (a real filesystem service) can serve them with .precompressed_br().
tempfile = "3.27.0"
# xtask dist: brotli-compresses each dist/ asset to a `.br` companion at build
# time. Pure Rust, no external `brotli` binary required on the build machine.
brotli = "9.0.0"

[profile.release]
panic = "unwind"
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.release-wasm]
inherits = "release"
opt-level = "z"

# The profile that 'dist' will build with — must match [profile.release] in
# CLAUDE.md exactly (panic = "unwind" is a hard invariant; lto = "fat" is required
# for release artifacts). No overrides here.
[profile.dist]
inherits = "release"
