[package]
name = "sp-web-host"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Daemon-backed providers (sp-engine, sp-api polling/SSE) will live behind this
# once phase 3 builds them. Today sp-engine is an empty stub and nothing in
# this crate is daemon-backed, so this flag gates nothing yet -- it exists so
# `trunk build --release --no-default-features` (T2.3, static deployment) is
# already the shape that later phases plug providers into, instead of being
# retrofitted then.
default = ["daemon"]
daemon = []

[dependencies]
sp-core.workspace = true
sp-ui.workspace = true
# ratatui itself is not a direct dep: Terminal/Frame come from ratzilla::ratatui
# (ratzilla re-exports its pinned ratatui so the two crate graphs stay unified).
ratzilla.workspace = true
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
